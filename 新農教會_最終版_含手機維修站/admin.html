<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>新農教會｜維修站</title><meta name="robots" content="noindex,nofollow"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{

button{min-height:44px}
header{

}
.nav{width:min(1180px,calc(100% - 28px));min-height:68px;margin:auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:900;color:var(--red2);font-size:21px;margin-right:auto}
.back{text-decoration:none;color:var(--red2);font-weight:900;border:1px solid var(--red2);padding:8px 11px;background:#f7e8ce}
.wrap{width:min(1180px,calc(100% - 28px));margin:24px auto 56px}
.login,.panel{
  background:rgba(244,225,193,.96);border:1px solid rgba(76,49,31,.34);
  box-shadow:var(--shadow);padding:20px;
}
.login{max-width:520px;margin:54px auto}
h1,h2,h3{margin:0 0 12px;color:var(--red2);line-height:1.35}
h1{font-size:28px} h2{font-size:23px}
.hint{color:var(--muted);font-size:13px;margin:5px 0 12px}
label{display:block;font-weight:800;margin:9px 0 5px}
input,textarea,select{
  width:100%;min-height:44px;padding:10px 11px;border:1px solid #9e7756;
  background:#fff7e9;color:#211713;border-radius:0

textarea{min-height:110px;resize:vertical}
button{

button.light{background:#efd7b2;color:#3a261c;border-color:#8f6748}
button.danger{background:#7b2929;border-color:#7b2929}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.status{margin-top:10px;padding:9px 11px;font-size:13px;display:none}
.status.show{display:block}.status.good{background:#dce9dc;color:#27422c}.status.bad{background:#efd4cf;color:#6c1e1e}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0;position:sticky;top:70px;z-index:15;padding:8px 0;background:linear-gradient(var(--kraft),var(--kraft))}

.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.list{display:grid;gap:12px;margin-top:16px}
.item{background:#f3dfbd;border-left:6px solid var(--red);padding:13px}
.item-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item .mini{font-size:12px;color:var(--muted);margin-bottom:6px}
.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.divider{height:1px;background:#ad8868;margin:18px 0}
.checkline{display:flex;align-items:center;gap:8px;margin-top:10px}
.checkline input{width:auto;min-height:auto}
.photo-row{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center;margin-top:8px}
.small{font-size:12px}

/* 手機版：真的可以用，不只是縮小 */
@media(max-width:760px){
  body{font-size:16px}
  .nav{width:min(100% - 18px,1180px);min-height:62px}
  .brand{font-size:18px}
  .back{padding:7px 9px;font-size:13px}
  .wrap{width:min(100% - 18px,1180px);margin:16px auto 40px}
  .login,.panel{padding:15px;box-shadow:0 8px 18px rgba(54,34,22,.13)}
  .login{margin:24px auto}
  h1{font-size:24px} h2{font-size:21px}
  .grid,.item-row,.photo-row{grid-template-columns:1fr}
  .full{grid-column:auto}
  .toolbar{align-items:stretch}
  .toolbar .spacer{display:none}
  .toolbar button{flex:1}
  .tabs{
    top:62px;
    overflow-x:auto;flex-wrap:nowrap;
    margin-left:-15px;margin-right:-15px;padding:8px 15px;
    -webkit-overflow-scrolling:touch;
  }
  .tab{flex:0 0 auto;white-space:nowrap}
  .actions button{flex:1 1 140px}
  .item-actions button{flex:1 1 120px}

}
@media(max-width:420px){
  .brand{font-size:16px}
  .badge{font-size:10px}
  .toolbar button{font-size:13px}

async function saveRow(t,id){const d={};defs[t].forEach(([f,,ty])=>d[f]=ty==='check'?$(t+'_'+id+'_'+f).checked:ty==='number'?Number($(t+'_'+id+'_'+f).value||0):$(t+'_'+id+'_'+f).value.trim());const r=await db.from(t).update(d).eq('id',id);if(r.error)return status('儲存失敗：'+r.error.message,false);status('儲存成功');loadRows(t)}
async function removeRow(t,id){if(!confirm('確定要刪除這筆資料嗎？此操作無法復原。'))return;const r=await db.from(t).delete().eq('id',id);if(r.error)return status('刪除失敗：'+r.error.message,false);status('刪除成功');loadRows(t)}
async function loadAlbums(){const {data,error}=await db.from('albums').select('*,album_photos(*)').order('sort_order');if(error)return status('相簿載入失敗：'+error.message,false);const albumFields=[['title','相簿名稱'],['event_date','日期'],['description','說明','textarea'],['cover_url','封面','image'],['sort_order','排序','number'],['published','顯示','check']];$('albumsList').innerHTML=(data||[]).map(a=>`<div class="item"><div class="grid">${albumFields.map(([f,l,t])=>field(f,l,t,a[f]??'',`album_${a.id}_`)).join('')}</div><div class="item-actions"><button onclick="saveAlbum('${a.id}')">儲存相簿</button><button class="danger" onclick="removeAlbum('${a.id}')">刪除相簿</button></div><h3>照片</h3>${(a.album_photos||[]).sort((x,y)=>x.sort_order-y.sort_order).map(p=>`<div class="grid"><img class="preview" src="${esc(p.photo_url)}"><label>順序<input id="photo_${p.id}_sort" type="number" value="${p.sort_order||0}"></label><label class="check"><input id="photo_${p.id}_pub" type="checkbox" ${p.published!==false?'checked':''}>顯示</label><button onclick="savePhoto('${p.id}')">儲存</button><button class="danger" onclick="removeRow('album_photos','${p.id}')">刪除照片</button></div>`).join('')}<div class="upload"><input id="newphoto_${a.id}" type="file" accept="image/*"><button onclick="addPhoto('${a.id}')">上傳照片</button><div class="progress"><i id="p_newphoto_${a.id}"></i></div><small id="u_newphoto_${a.id}"></small></div></div>`).join('')}
async function addAlbum(){const r=await db.from('albums').insert({title:'新相簿',sort_order:999,published:true});if(r.error)return status('新增失敗：'+r.error.message,false);status('新增相簿成功');loadAlbums()}
async function saveAlbum(id){const d={};for(const f of ['title','event_date','description','cover_url'])d[f]=$(`album_${id}_${f}`).value.trim();d.sort_order=Number($(`album_${id}_sort_order`).value||0);d.published=$(`album_${id}_published`).checked;const r=await db.from('albums').update(d).eq('id',id);if(r.error)return status('儲存失敗：'+r.error.message,false);status('儲存成功');loadAlbums()}
async function removeAlbum(id){if(!confirm('確定刪除整個相簿及所有照片資料嗎？'))return;let p=await db.from('album_photos').delete().eq('album_id',id);if(p.error)return status('刪除照片失敗：'+p.error.message,false);let r=await db.from('albums').delete().eq('id',id);if(r.error)return status('刪除失敗：'+r.error.message,false);status('相簿已刪除');loadAlbums()}
async function addPhoto(id){const input=$('newphoto_'+id);if(!input.files[0])return status('請先選擇照片',false);try{const url=await putBlob(input.files[0],input.files[0].name,p=>$('p_newphoto_'+id).style.width=p+'%'),r=await db.from('album_photos').insert({album_id:id,photo_url:url,sort_order:999,published:true});if(r.error)throw r.error;status('照片上傳完成');loadAlbums()}catch(e){status('照片上傳失敗：'+e.message,false)}}
async function removeRow(t,id){if(t==='album_photos')return removePhoto(id);if(!confirm('確定要刪除這筆資料嗎？此操作無法復原。'))return;const r=await db.from(t).delete().eq('id',id);if(r.error)return status('刪除失敗：'+r.error.message,false);status('刪除成功');loadRows(t)}
async function removePhoto(id){if(!confirm('確定要刪除這張照片嗎？'))return;const r=await db.from('album_photos').delete().eq('id',id);if(r.error)return status('刪除失敗：'+r.error.message,false);status('照片已刪除');loadAlbums()}
async function savePhoto(id){const r=await db.from('album_photos').update({sort_order:Number($(`photo_${id}_sort`).value||0),published:$(`photo_${id}_pub`).checked}).eq('id',id);if(r.error)return status('儲存失敗：'+r.error.message,false);status('儲存成功');loadAlbums()}
$('login').onclick=async()=>{const username=$('email').value.trim(),loginEmail=username.toLowerCase()==='sinnung'?'u11206003@go.utaipei.edu.tw':username;$('login').disabled=true;const {error}=await db.auth.signInWithPassword({email:loginEmail,password:$('password').value});$('login').disabled=false;if(error)return status('登入失敗：'+error.message,false,'loginStatus');status('登入成功',true,'loginStatus');boot()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('view-'+b.dataset.tab).classList.add('active')});db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script></body></html>
